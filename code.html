<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- html5-qrcode Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pyidaungsu', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-40 flex justify-between items-center shadow-xs">
        <h1 class="text-lg font-bold text-slate-900 tracking-tight">📦 InvenScan <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">Pro</span></h1>
        <div class="text-sm font-medium text-slate-500">စုစုပေါင်း: <span id="total-count" class="text-slate-900 font-bold">0</span> ခု</div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-28 space-y-6">
        
        <!-- Search Bar -->
        <div class="relative">
            <input type="text" id="search-box" oninput="handleSearch()" placeholder="အမျိုးအစား၊ နာမည် (သို့) Serial No ဖြင့် ရှာရန်..." 
                class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 pl-11 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs transition">
            <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>

        <!-- Category Dashboard Grid -->
        <div>
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">အမျိုးအစားအလိုက် ကြည့်ရန်</h2>
                <button onclick="filterByCategory('all')" class="text-xs text-indigo-600 font-bold hover:underline">အားလုံးပြရန်</button>
            </div>
            <div id="category-grid" class="grid grid-cols-4 gap-2.5">
                <!-- JavaScript မှတဆင့် ဝင်ရောက်လာမည် -->
            </div>
        </div>

        <!-- Scanned Items List -->
        <div class="space-y-3">
            <div class="flex justify-between items-center px-1">
                <h2 id="list-title" class="text-xs font-bold uppercase tracking-wider text-slate-400">ပစ္စည်းစာရင်းများ</h2>
                <span class="text-[11px] text-indigo-600 font-medium">ပြင်ဆင်ရန် ကတ်ပြားကိုနှိပ်ပါ</span>
            </div>
            <div id="item-list" class="space-y-3">
                <!-- JavaScript မှတဆင့် ဝင်ရောက်လာမည် -->
            </div>
        </div>
    </main>

    <!-- Floating Action Button (Camera Scan Trigger) -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center z-40 pointer-events-none">
        <button onclick="startScanner()" class="pointer-events-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-4 rounded-full shadow-xl flex items-center gap-2 transform active:scale-95 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>ကင်မရာဖွင့်ရန် (Scan)</span>
        </button>
    </div>

    <!-- Scanner Modal -->
    <div id="scanner-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col justify-between p-4">
        <div class="flex justify-between items-center text-white">
            <h3 class="font-bold text-lg">ဘားကုဒ် / QR စကန်ဖတ်နေသည်...</h3>
            <button onclick="stopScanner()" class="bg-white/20 px-4 py-2 rounded-lg text-sm font-bold">ပိတ်မည် (Close)</button>
        </div>
        <div class="w-full max-w-sm mx-auto bg-black rounded-2xl overflow-hidden relative">
            <div id="reader"></div>
        </div>
        <div class="text-center text-white/70 text-xs pb-4">ကင်မရာဘောင်အတွင်းသို့ ကုဒ်ကို ထည့်ပါ</div>
    </div>

    <!-- New Item Registration Modal -->
    <div id="new-item-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-lg text-slate-900">✨ ပစ္စည်းအသစ် တွေ့ရှိပါသည်</h3>
            <p class="text-xs text-slate-500">ဤကုဒ်အတွက် လိုအပ်သော အချက်အလက်များ ဖြည့်သွင်းပါ။</p>
            
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Serial / Barcode</label>
                <input type="text" id="new-code" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">အမျိုးအစား (Category)</label>
                <select id="new-category" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                    <!-- Categories will be loaded dynamically -->
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">အများသုံးအမျိုးအစား (Generic Name)</label>
                <input type="text" id="new-generic" placeholder="ဥပမာ - သွေးပေါင်ချိန်စက်" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">တိကျသောနာမည်/တံဆိပ် (Brand / Model)</label>
                <input type="text" id="new-brand" placeholder="ဥပမာ - Omron M2" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="closeNewItemModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition">မလုပ်တော့ပါ</button>
                <button onclick="saveNewItem()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition">သိမ်းမည်</button>
            </div>
        </div>
    </div>

    <!-- Edit Item Modal -->
    <div id="edit-item-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
            <h3 class="font-bold text-lg text-slate-900">✏️ ပစ္စည်းအချက်အလက် ပြင်ဆင်ရန်</h3>
            <input type="hidden" id="edit-original-code">
            
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">အမျိုးအစား (Category)</label>
                <select id="edit-category" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">အများသုံးအမျိုးအစား (Generic Name)</label>
                <input type="text" id="edit-generic" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">တိကျသောနာမည်/တံဆိပ် (Brand / Model)</label>
                <input type="text" id="edit-brand" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">လက်ကျန်အရေအတွက် (Quantity)</label>
                <input type="number" id="edit-qty" min="0" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="deleteItem()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-3 py-2.5 rounded-xl text-sm transition">ဖျက်မည်</button>
                <button onclick="closeEditModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm transition">မလုပ်တော့ပါ</button>
                <button onclick="saveEditedItem()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm transition">သိမ်းမည်</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const categories = [
            { name: "စားသောက်ကုန်", icon: "🍔" },
            { name: "လူသုံးကုန်", icon: "🧴" },
            { name: "ကျား/မ အသုံးအဆောင်", icon: "👕" },
            { name: "ကလေးအသုံးအဆောင်", icon: "🍼" },
            { name: "ဆေးဝါး", icon: "💊" },
            { name: "စက်ပစ္စည်း", icon: "⚙️" },
            { name: "လျှပ်စစ်", icon: "⚡" },
            { name: "စာရေးကရိယာ", icon: "📚" }
        ];

        let html5QrCode = null;
        let db = JSON.parse(localStorage.getItem('inv_scanner_final_db')) || [];
        let currentFilter = 'all';

        function initApp() {
            renderCategories();
            populateCategoryDropdowns();
            renderList();
        }

        function renderCategories() {
            const grid = document.getElementById('category-grid');
            grid.innerHTML = '';
            
            categories.forEach(cat => {
                const count = db.filter(item => item.category === cat.name).length;
                const isActive = currentFilter === cat.name;
                grid.innerHTML += `
                    <div onclick="filterByCategory('${cat.name}')" class="bg-white border ${isActive ? 'border-indigo-600 ring-2 ring-indigo-100' : 'border-slate-200'} p-3 rounded-2xl flex flex-col items-center justify-center text-center cursor-pointer hover:border-indigo-400 transition shadow-xs">
                        <span class="text-2xl mb-1">${cat.icon}</span>
                        <span class="text-[11px] font-bold text-slate-700 truncate w-full">${cat.name}</span>
                        <span class="text-[10px] text-slate-400 mt-0.5">${count} ခု</span>
                    </div>
                `;
            });
        }

        function populateCategoryDropdowns() {
            const newSelect = document.getElementById('new-category');
            const editSelect = document.getElementById('edit-category');
            
            let optionsHtml = '';
            categories.forEach(cat => {
                optionsHtml += `<option value="${cat.name}">${cat.icon} ${cat.name}</option>`;
            });

            newSelect.innerHTML = optionsHtml;
            editSelect.innerHTML = optionsHtml;
        }

        function filterByCategory(catName) {
            currentFilter = catName;
            renderCategories();
            
            if (catName === 'all') {
                document.getElementById('list-title').innerText = 'ပစ္စည်းစာရင်းအားလုံး';
                renderList(db);
            } else {
                document.getElementById('list-title').innerText = `${catName} စာရင်းများ`;
                const filtered = db.filter(item => item.category === catName);
                renderList(filtered);
            }
        }

        function renderList(itemsToDisplay = db) {
            const listEl = document.getElementById('item-list');
            const totalEl = document.getElementById('total-count');
            
            listEl.innerHTML = '';
            totalEl.innerText = db.reduce((sum, item) => sum + item.qty, 0);

            if (itemsToDisplay.length === 0) {
                listEl.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm bg-white rounded-2xl border border-slate-200">ဤအမျိုးအစားတွင် စာရင်းမရှိသေးပါ။</div>`;
                return;
            }

            itemsToDisplay.forEach(item => {
                const catObj = categories.find(c => c.name === item.category) || { icon: "📦" };
                listEl.innerHTML += `
                    <div onclick="openEditModal('${item.code}')" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between cursor-pointer hover:border-indigo-400 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-xl shrink-0">
                                ${catObj.icon}
                            </div>
                            <div>
                                <span class="inline-block bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded-md mb-0.5">${item.category || 'အမျိုးအစားမရှိ'}</span>
                                <h3 class="font-bold text-slate-800 text-sm">${item.brandName || 'အမည်မသိ'} <span class="text-xs font-normal text-slate-500">(${item.genericName || ''})</span></h3>
                                <p class="text-xs text-slate-400 mt-0.5">SN: ${item.code}</p>
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <span class="inline-block bg-emerald-50 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-lg">လက်ကျန်: ${item.qty}</span>
                            <p class="text-[10px] text-slate-400 mt-1">${item.date}</p>
                        </div>
                    </div>
                `;
            });
        }

        function startScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    stopScanner();
                    handleScannedCode(decodedText);
                },
                (error) => {}
            ).catch(err => {
                alert("ကင်မရာဖွင့်၍ မရပါ။ ခွင့်ပြုချက် (Permission) ပေးထားခြင်း ရှိမရှိ စစ်ဆေးပါ။");
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-modal').classList.add('hidden');
                }).catch(err => {
                    document.getElementById('scanner-modal').classList.add('hidden');
                });
            } else {
                document.getElementById('scanner-modal').classList.add('hidden');
            }
        }

        function handleScannedCode(code) {
            let existingItem = db.find(item => item.code === code);
            
            if (existingItem) {
                existingItem.qty += 1;
                existingItem.date = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                saveAndRefresh();
            } else {
                document.getElementById('new-code').value = code;
                document.getElementById('new-generic').value = '';
                document.getElementById('new-brand').value = '';
                document.getElementById('new-item-modal').classList.remove('hidden');
            }
        }

        function saveNewItem() {
            const code = document.getElementById('new-code').value;
            const category = document.getElementById('new-category').value;
            const genericName = document.getElementById('new-generic').value.trim() || "အထွေထွေပစ္စည်း";
            const brandName = document.getElementById('new-brand').value.trim() || "အမည်မသိ တံဆိပ်";
            const date = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            db.unshift({ code, category, genericName, brandName, qty: 1, date });
            saveAndRefresh();
            closeNewItemModal();
        }

        function closeNewItemModal() {
            document.getElementById('new-item-modal').classList.add('hidden');
        }

        function openEditModal(code) {
            const item = db.find(i => i.code === code);
            if (!item) return;

            document.getElementById('edit-original-code').value = item.code;
            document.getElementById('edit-category').value = item.category || categories[0].name;
            document.getElementById('edit-generic').value = item.genericName || '';
            document.getElementById('edit-brand').value = item.brandName || '';
            document.getElementById('edit-qty').value = item.qty;
            document.getElementById('edit-item-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-item-modal').classList.add('hidden');
        }

        function saveEditedItem() {
            const code = document.getElementById('edit-original-code').value;
            const newCategory = document.getElementById('edit-category').value;
            const newGeneric = document.getElementById('edit-generic').value.trim();
            const newBrand = document.getElementById('edit-brand').value.trim();
            const newQty = parseInt(document.getElementById('edit-qty').value);

            let item = db.find(i => i.code === code);
            if (item) {
                item.category = newCategory;
                if (newGeneric) item.genericName = newGeneric;
                if (newBrand) item.brandName = newBrand;
                if (!isNaN(newQty)) item.qty = newQty;
                item.date = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                saveAndRefresh();
            }
            closeEditModal();
        }

        function deleteItem() {
            if (!confirm("ဤပစ္စည်းကို စာရင်းထဲမှ ဖျက်ရန် သေချာပါသလား?")) return;
            const code = document.getElementById('edit-original-code').value;
            db = db.filter(i => i.code !== code);
            saveAndRefresh();
            closeEditModal();
        }

        function saveAndRefresh() {
            localStorage.setItem('inv_scanner_final_db', JSON.stringify(db));
            renderCategories();
            filterByCategory(currentFilter);
        }

        function handleSearch() {
            const keyword = document.getElementById('search-box').value.toLowerCase();
            const listToSearch = currentFilter === 'all' ? db : db.filter(i => i.category === currentFilter);
            
            const filtered = listToSearch.filter(item => 
                (item.genericName && item.genericName.toLowerCase().includes(keyword)) || 
                (item.brandName && item.brandName.toLowerCase().includes(keyword)) || 
                (item.category && item.category.toLowerCase().includes(keyword)) ||
                (item.code && item.code.toLowerCase().includes(keyword))
            );
            renderList(filtered);
        }

        initApp();
    </script>
</body>
</html>
